gui:
  # Sets the border style (single, double, rounded, thick)
  border: 'rounded'
  # Displays icons for files and branches (requires Nerd Font)
  showIcons: true
  nerdFontsVersion: "3"
theme:
  activeBorderColor:
    - '#a6d189'
    - bold
  inactiveBorderColor:
    - '#a5adce'
  searchingActiveBorderColor:
    - '#e5c890'
  optionsTextColor:
    - '#8caaee'
  selectedLineBgColor:
    - '#414559'
  inactiveViewSelectedLineBgColor:
    - '#737994'
  cherryPickedCommitFgColor:
    - '#a6d189'
  cherryPickedCommitBgColor:
    - '#51576d'
  markedBaseCommitFgColor:
    - '#8caaee'
  markedBaseCommitBgColor:
    - '#e5c890'
  unstagedChangesColor:
    - '#e78284'
  defaultFgColor:
    - '#c6d0f5'
authorColors:
  '*': '#babbf1'
git:
  pagers:
    - colorArg: always
      paging:
      pager: delta --paging=never
