
[colors]
# Nordic Color Scheme
nord0 = #2e3440
nord1 = #3b4252
nord2 = #434c5e
nord3 = #4c566a
nord4 = #d8dee9
nord5 = #e5e9f0
nord6 = #eceff4
nord7 = #8fbcbb
nord8 = #88c0d0
nord9 = #81a1c1
nord10 = #5e81ac
nord11 = #bf616a
nord12 = #d08770
nord13 = #ebcb8b
nord14 = #a3be8c
nord15 = #b48ead

[colors]
background = ${colors.nord0}
background-alt = ${colors.nord10}
foreground = ${colors.nord4}
primary = ${colors.nord15}
secondary = ${colors.nord1}
alert = ${colors.nord11}
disabled = ${colors.nord3}

[bar/toph]
monitor = ${env:monitor:}
width = 100%
height = 16pt
radius = 0

; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

bottom = true 
top = false 
line-size = 0pt

border-size = 0pt
border-color = #00000000

padding-left = 0
padding-right = 1

module-margin = 1 
separator =  
separator-foreground = ${colors.nord12}

font-0 = "FiraCode Nerd Font:size=11;2"
font-1 = "Noto Color Emoji:scale=16;4"
font-2 = "FiraCode Nerd Font:size=16;4"

modules-left = xworkspaces xwindow
modules-right = pulseaudio settings eth 
; filesystem memory cpu eth 
modules-center = date xkeyboard 

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; wm-restack = generic
; wm-restack = bspwm
; wm-restack = i3

; override-redirect = true

[module/systray]
type = internal/tray

format-margin = 8pt
tray-spacing = 16pt

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.nord9}
label-active-foreground = ${colors.nord0}
label-active-underline = ${colors.nord8}
label-active-padding = 1

label-occupied = %name%
label-occupied-foreground = ${colors.nord6}
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /

label-mounted = %{T3}%{F#81a1c1}󰑹%{f-}%{t-} %free% 

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio

click-right = pavucontrol &

format-volume = <label-volume>
format-volume-prefix-foreground = #81A1C1
label-volume = %{F#81a1c1}  %{F-}%percentage%%
label-volume-foreground = #D8DEE9

format-muted = <label-muted>
format-muted-prefix = "   "
format-muted-prefix-foreground = #BF616A
label-muted = " "
label-muted-foreground = #4C566A

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = %layout%
label-layout-foreground = ${colors.primary}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 2
format-prefix = %{T3}%{F#81a1c1} %{F-}%{T-}
format-prefix-foreground = ${colors.nord9}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = %{T3}%{F#81a1c1} %{F-}%{T-}
format-prefix-foreground = ${colors.nord9}
label = %percentage:2%%


[network-base]
type = internal/network
interval = 1.0
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#BF616A}   %{F#4C566A}offline
; Общий клик для всех сетевых модулей
click-left = nm-connection-editor &

[module/wlan]
inherit = network-base
interface-type = wireless
; Иконка Wi-Fi + имя сети + скорость (Nord цвета)
format-connected-prefix = "  "
format-connected-prefix-foreground = #88C0D0
label-connected = %{F#D8DEE9}%essid%%{F-}  %{F#A3BE8C} %{F-}%downspeed%  %{F#BF616A} %{F-}%upspeed%

[module/eth]
inherit = network-base
interface-type = wired
interface = enp33s0
format-connected-prefix-foreground = #88C0D0
label-connected = %{A1:nm-connection-editor:}%{F#A3BE8C} %{F-}%downspeed%  %{F#BF616A} %{F-}%upspeed%%{A}


[module/date]
type = internal/date
interval = 1

date = %d/%m/%Y %r
date-alt = %d/%m/%Y %r

label = %date%
label-foreground = ${colors.nord9}

[module/settings]
type = custom/text
; Иконка шестеренки из Nerd Fonts (убедитесь, что шрифт установлен)
content = "  "
content-foreground = #88C0D0
content-background = #2E3440
content-padding = 0

click-left = garuda-toolbox

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
